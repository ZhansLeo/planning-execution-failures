[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travelplanner-agent"
version = "0.1.0"
description = "A non-invasive TravelPlanner agent research harness"
requires-python = ">=3.9"
dependencies = ["openai>=1.0.0", "pandas>=2.1.0", "python-dotenv>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

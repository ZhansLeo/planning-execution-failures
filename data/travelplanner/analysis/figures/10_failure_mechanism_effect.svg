<text x="535" y="718" class="title" fill="#CCBB44">→</text>
<rect x="620" y="660" width="330" height="95" rx="12" fill="#CCBB44" opacity=".9"/>
<text x="785" y="716" text-anchor="middle" class="lab" fill="white">Verifier + Single Replan</text>
<text x="1015" y="718" class="title" fill="#CCBB44">→</text>
<rect x="1100" y="660" width="420" height="95" rx="12" fill="#FFF" stroke="#CCBB44" stroke-width="3"/>
<text x="1310" y="716" text-anchor="middle" class="lab">Delivery +1.67pp，Final Pass 不变</text>

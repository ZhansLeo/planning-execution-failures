<text x="535" y="398" class="title" fill="#EE6677">→</text>
<rect x="620" y="340" width="330" height="95" rx="12" fill="#EE6677" opacity=".9"/>
<text x="785" y="396" text-anchor="middle" class="lab" fill="white">Official tools + ReAct</text>
<text x="1015" y="398" class="title" fill="#EE6677">→</text>
<rect x="1100" y="340" width="420" height="95" rx="12" fill="#FFF" stroke="#EE6677" stroke-width="3"/>
<text x="1310" y="396" text-anchor="middle" class="lab">Delivery −60pp，成本显著上升</text>
<rect x="80" y="500" width="390" height="95" rx="12" fill="#FFF" stroke="#228833" stroke-width="3"/>
<text x="275" y="556" text-anchor="middle" class="lab">全局路线与检索失焦</text>
<text x="535" y="558" class="title" fill="#228833">→</text>
<rect x="620" y="500" width="330" height="95" rx="12" fill="#228833" opacity=".9"/>
<text x="785" y="556" text-anchor="middle" class="lab" fill="white">Explicit Planner</text>
<text x="1015" y="558" class="title" fill="#228833">→</text>
<rect x="1100" y="500" width="420" height="95" rx="12" fill="#FFF" stroke="#228833" stroke-width="3"/>
<text x="1310" y="556" text-anchor="middle" class="lab">Delivery +5pp，Token 略降</text>
<rect x="80" y="660" width="390" height="95" rx="12" fill="#FFF" stroke="#CCBB44" stroke-width="3"/>
